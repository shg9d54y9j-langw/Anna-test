name: Rechenkontrolle

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Job gegen Test-Server, unabhängige Gegenrechnung, Live-Wächter
        env:
          ETORO_API_BASE: http://localhost:8790/api
          ETORO_THROTTLE_MS: "0"
          ETORO_API_KEY: test-public-key-0000
          ETORO_USER_KEY: test-user-key-0000
          RANKING_OUT: /tmp/ranking.json
          RETURNS_OUT: /tmp/returns.json
          RANKING_IN: /tmp/ranking.json
          LIVE_OUT: /tmp/live.json
        run: |
          node tests/mock-etoro.mjs 8790 & sleep 1
          node scripts/daily-ranking.mjs
          python3 tests/verify_ranking.py /tmp/ranking.json /tmp/returns.json
          node scripts/live-watch.mjs
          node -e 'const d = JSON.parse(require("fs").readFileSync("/tmp/live.json", "utf8")); if (!d.entries.length) throw new Error("Live-Stand leer");'

      - name: Marktlage-Cockpit gegen den Test-Server, unabhängige Gegenrechnung
        env:
          ETORO_API_BASE: http://localhost:8791/api
          ETORO_THROTTLE_MS: "0"
          ETORO_API_KEY: test-public-key-0000
          ETORO_USER_KEY: test-user-key-0000
          FRED_BASE: http://localhost:8791/fred
          MARKET_OUT: /tmp/market.json
        run: |
          node tests/mock-etoro.mjs 8791 & sleep 1
          node scripts/market-cockpit.mjs
          python3 tests/verify_market.py /tmp/market.json http://localhost:8791

      - name: Copy-Bot gegen den Test-Server (Start, Wechsel, Stop Loss, eigene Kopien, Echtgeld-Obergrenze)
        run: node tests/bot-scenarios.mjs

      - name: Schlüssel gehen nur an eToro
        run: |
          if ETORO_API_BASE=https://example.com/api ETORO_API_KEY=x-123456789 ETORO_USER_KEY=y-123456789 node scripts/daily-ranking.mjs; then
            echo "::error::Fremde API-Adresse wurde nicht abgewiesen"; exit 1
          fi
          echo "Fremde Adresse korrekt abgewiesen."

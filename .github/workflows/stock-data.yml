name: Aktien-Daten

# Kennzahlen der beliebtesten Aktien und ETFs bei eToro für den Aktien-Check der Website.
on:
  schedule:
    - cron: "5 5 * * 1-5"     # Mo–Fr früh (06:05 Uhr Winterzeit / 07:05 Uhr Sommerzeit)
    - cron: "35 13 * * 1-5"   # Mo–Fr vor US-Eröffnung (14:35 / 15:35 Uhr)
  workflow_dispatch:

permissions: {}

concurrency:
  group: stock-data
  cancel-in-progress: false

jobs:
  # Kennt die eToro-Schlüssel (nur lesen), darf im Repository nichts ändern.
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    outputs:
      stocks: ${{ steps.calc.outputs.stocks }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Kennzahlen der beliebtesten Aktien und ETFs berechnen
        id: calc
        env:
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ETORO_THROTTLE_MS: "560"     # Marktdaten: 120 Abfragen pro Minute
        run: |
          node scripts/stock-universe.mjs
          if [ -f data/stocks.json ]; then
            echo "stocks=$(gzip -9c data/stocks.json | base64 -w0)" >> "$GITHUB_OUTPUT"
          fi

  # Veröffentlicht die Kennzahlen und den Swing-Plan auf dem Zweig stock-data – ohne eToro-Schlüssel.
  # Der Swing-Planer (scripts/swing-planner.mjs) rechnet dabei aus den frischen Kennzahlen, den Firmen-Steckbriefen
  # und dem bisherigen Plan (Papier-Bilanz) den neuen Plan.
  save:
    needs: fetch
    if: needs.fetch.outputs.stocks != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Aktien-Daten und Swing-Plan veröffentlichen
        env:
          STOCKS_B64: ${{ needs.fetch.outputs.stocks }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          REMOTE="https://github.com/${REPO}.git" PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" REPO_DIR="$PWD" \
            bash scripts/publish-stock-data.sh

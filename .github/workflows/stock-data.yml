name: Aktien-Daten

# Kennzahlen der beliebtesten Aktien und ETFs bei eToro für den Aktien-Check der Website.
on:
  schedule:
    - cron: "5 5 * * 1-5"     # Mo–Fr früh (06:05 Uhr Winterzeit / 07:05 Uhr Sommerzeit)
    - cron: "35 13 * * 1-5"   # Mo–Fr vor US-Eröffnung (14:35 / 15:35 Uhr)
  workflow_dispatch:

permissions: {}

concurrency:
  group: stock-data
  cancel-in-progress: false

jobs:
  # Kennt die eToro-Schlüssel (nur lesen), darf im Repository nichts ändern.
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    outputs:
      stocks: ${{ steps.calc.outputs.stocks }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Kennzahlen der beliebtesten Aktien und ETFs berechnen
        id: calc
        env:
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ETORO_THROTTLE_MS: "560"     # Marktdaten: 120 Abfragen pro Minute
        run: |
          node scripts/stock-universe.mjs
          if [ -f data/stocks.json ]; then
            echo "stocks=$(gzip -9c data/stocks.json | base64 -w0)" >> "$GITHUB_OUTPUT"
          fi

  # Veröffentlicht die Kennzahlen auf dem Zweig stock-data – ohne Schlüssel.
  save:
    needs: fetch
    if: needs.fetch.outputs.stocks != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Aktien-Daten veröffentlichen
        env:
          STOCKS_B64: ${{ needs.fetch.outputs.stocks }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir out && cd out
          printf '%s' "$STOCKS_B64" | base64 -d | gunzip > stocks.json
          node -e '
            const d = JSON.parse(require("fs").readFileSync("stocks.json", "utf8"));
            if (!Array.isArray(d.items) || d.items.length < 50) { console.log("::error::Zu wenige Werte – nichts veröffentlicht"); process.exit(1); }
            console.log(`${d.items.length} Werte`);
          '
          git init -q -b stock-data
          git add stocks.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Aktien-Daten $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:stock-data

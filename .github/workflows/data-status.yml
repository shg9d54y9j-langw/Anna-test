name: Daten-Status

# Alle zwei Stunden: Wie frisch ist jede Auswertung, und sind die letzten Läufe gelungen? Schreibt status.json auf den Zweig
# status (die Seite zeigt sie an der Live-Uhr) und meldet neue Ausfälle und behobene aufs Handy, falls ntfy eingerichtet ist.
on:
  schedule:
    - cron: "53 */2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: data-status
  cancel-in-progress: false

jobs:
  # Liest die öffentlichen Datenzweige und die letzten Läufe (nur lesen) – kennt keine Secrets.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    outputs:
      alerts: ${{ steps.check.outputs.alerts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bisherigen Stand holen
        run: |
          if git fetch -q --depth=1 origin status 2>/dev/null; then
            git show FETCH_HEAD:status.json > "$RUNNER_TEMP/status-prev.json" || true
          else
            echo "Noch kein Stand vorhanden."
          fi

      - name: Datenstand und Läufe prüfen
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STATUS_PREV: ${{ runner.temp }}/status-prev.json
          STATUS_OUT: ${{ runner.temp }}/status.json
        run: |
          node scripts/data-status.mjs
          # shellcheck disable=SC2016
          echo "alerts=$(node -e 'const d = JSON.parse(require("fs").readFileSync(process.env.STATUS_OUT, "utf8")); process.stdout.write(String(d.alerts.new.length + d.alerts.resolved.length))')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: status
          path: ${{ runner.temp }}/status.json
          retention-days: 1
          if-no-files-found: error

  # Veröffentlicht status.json auf dem Zweig status.
  save:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: status
          path: incoming

      - name: Daten-Status veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir out && cd out
          cp ../incoming/status.json .
          node -e 'const d = JSON.parse(require("fs").readFileSync("status.json", "utf8")); if (!Array.isArray(d.sources) || !d.sources.length) process.exit(1);'
          git init -q -b status
          git add status.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Daten-Status $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:status && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 4))
          done

  # Neue Ausfälle und behobene aufs Handy – kennt nur den ntfy-Kanal, darf im Repository nichts ändern.
  notify:
    needs: [check, save]
    if: needs.check.outputs.alerts != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: status
          path: incoming

      - name: Ausfälle aufs Handy (ntfy), falls eingerichtet
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_MODE: status
          STATUS_JSON: incoming/status.json
        run: node scripts/notify.mjs

name: Live-Runde

# Eine Runde des Live-Wächters: Werte holen (mit Schlüssel, ohne Schreibrechte),
# dann veröffentlichen (mit Schreibrechten, ohne Schlüssel). Danach gleicht der Copy-Bot die Tageswahl
# mit dem eToro-Konto ab (eigener Schlüssel, ebenfalls ohne Schreibrechte im Repository).
# Wird vom Live-Wächter mehrmals hintereinander aufgerufen.
on:
  workflow_call:
    inputs:
      delay:
        description: Wartezeit vor dieser Runde in Sekunden
        type: number
        default: 0
    secrets:
      ETORO_API_KEY:
        required: true
      ETORO_USER_KEY:
        required: true
      ETORO_BOT_API_KEY:          # Bot im Demokonto (Spielgeld): Schlüssel nur mit „Trading – Demo → Write“
        required: false
      ETORO_BOT_USER_KEY:
        required: false

permissions: {}

jobs:
  # Kennt die eToro-Schlüssel, darf aber nichts verändern.
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      live: ${{ steps.watch.outputs.live }}
      market: ${{ steps.market.outputs.market }}
    steps:
      - name: Bis zur nächsten Runde warten
        if: inputs.delay > 0
        env:
          DELAY: ${{ inputs.delay }}
        run: sleep "$DELAY"

      # Erst nach dem Warten auschecken, damit eine neue Tageswahl sofort verfolgt wird
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Live-Werte holen
        id: watch
        env:
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
          LIVE_PREV_URL: https://raw.githubusercontent.com/${{ github.repository }}/live-data/live.json
        run: |
          node scripts/live-watch.mjs
          if [ -f data/live.json ]; then
            echo "live=$(base64 -w0 data/live.json)" >> "$GITHUB_OUTPUT"
          fi

      # Marktlage-Cockpit: Trend, Schwankung, Zinskurve, Finanzbedingungen. Ein Fehler hier stoppt den Live-Wächter nicht.
      - name: Marktlage berechnen
        id: market
        env:
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
        run: |
          node scripts/market-cockpit.mjs || echo "::warning::Marktlage-Cockpit fehlgeschlagen – der letzte Stand bleibt stehen."
          if [ -f data/market.json ]; then
            echo "market=$(base64 -w0 data/market.json)" >> "$GITHUB_OUTPUT"
          fi

  # Veröffentlicht den Live-Stand auf dem Zweig live-data und meldet neue Warnungen – ohne eToro-Schlüssel.
  save:
    needs: fetch
    if: needs.fetch.outputs.live != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - name: Live-Stand veröffentlichen
        env:
          LIVE_B64: ${{ needs.fetch.outputs.live }}
          MARKET_B64: ${{ needs.fetch.outputs.market }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir live && cd live
          printf '%s' "$LIVE_B64" | base64 -d > live.json
          node -e 'JSON.parse(require("fs").readFileSync("live.json", "utf8"))'
          if [ -n "$MARKET_B64" ]; then
            printf '%s' "$MARKET_B64" | base64 -d > market.json
          else
            # Cockpit diesmal ohne Ergebnis: letzten veröffentlichten Stand behalten
            curl -fsS --max-time 20 "https://raw.githubusercontent.com/${REPO}/live-data/market.json" -o market.json || rm -f market.json
          fi
          if [ -f market.json ]; then node -e 'JSON.parse(require("fs").readFileSync("market.json", "utf8"))' || rm -f market.json; fi
          git init -q -b live-data
          git add live.json
          if [ -f market.json ]; then git add market.json; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Live-Stand $(date -u +%FT%TZ)"
          # GitHub lehnt Pushes selten vorübergehend ab („fatal error in commit_refs“) – dann bis zu fünfmal versuchen
          for i in 1 2 3 4 5; do
            git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:live-data && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 4))
          done

      - name: Bei neuen Warnungen benachrichtigen
        env:
          LIVE_B64: ${{ needs.fetch.outputs.live }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          printf '%s' "$LIVE_B64" | base64 -d | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8"));
            for (const a of d.newAlerts || []) console.log(a.text);
          ' > new-alerts.txt
          # Deutsche Anführungszeichen im Nachrichtentext sind gewollt:
          # shellcheck disable=SC1111
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            gh issue create --repo "$REPO" --title "Warnung: $line" \
              --body "$line

          Prüfen Sie die Kopie in eToro (Portfolio → Trader → Zahnrad → „Kopieren pausieren“).
          Live-Stand: https://shg9d54y9j-langw.github.io/Anna-test/#daily"
          done < new-alerts.txt

  # Copy-Bot: kopiert die geprüfte Tageswahl im eToro-Konto. Kennt nur den Bot-Schlüssel, darf im Repository nichts ändern.
  bot:
    needs: fetch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      bot: ${{ steps.bot.outputs.bot }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Letzten Bot-Stand holen
        run: |
          if git fetch -q --depth=1 origin bot-data 2>/dev/null; then
            git show FETCH_HEAD:bot.json > "$RUNNER_TEMP/bot-prev.json" || true
          else
            echo "Noch kein Bot-Stand vorhanden."
          fi

      - name: Tageswahl im eToro-Konto abgleichen
        id: bot
        env:
          BOT_MODE: ${{ vars.BOT_MODE }}
          COPY_BOT_BUDGET_EUR: ${{ vars.COPY_BOT_BUDGET_EUR }}   # Spielgeld für die Kopie in Euro (leer = 1000)
          # Nur der Demo-Schlüssel: Echtgeld ist gesperrt, ein Echtgeld-Schlüssel wird gar nicht erst übergeben
          ETORO_API_KEY: ${{ secrets.ETORO_BOT_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_BOT_USER_KEY }}
          BOT_STATE_IN: ${{ runner.temp }}/bot-prev.json
        run: |
          code=0
          node scripts/copy-bot.mjs || code=$?
          if [ -f data/bot.json ]; then
            echo "bot=$(base64 -w0 data/bot.json)" >> "$GITHUB_OUTPUT"
          fi
          exit $code

  # Veröffentlicht den Bot-Stand (ohne Beträge) auf dem Zweig bot-data und meldet wichtige Ereignisse – ohne eToro-Schlüssel.
  bot-save:
    needs: bot
    if: ${{ !cancelled() && needs.bot.outputs.bot != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - name: Bot-Stand veröffentlichen
        env:
          BOT_B64: ${{ needs.bot.outputs.bot }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir bot && cd bot
          printf '%s' "$BOT_B64" | base64 -d > bot.json
          node -e 'JSON.parse(require("fs").readFileSync("bot.json", "utf8"))'
          git init -q -b bot-data
          git add bot.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Bot-Stand $(date -u +%FT%TZ)"
          # GitHub lehnt Pushes selten vorübergehend ab („fatal error in commit_refs“) – dann bis zu fünfmal versuchen
          for i in 1 2 3 4 5; do
            git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:bot-data && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 4))
          done

      - name: Wichtige Bot-Ereignisse melden
        env:
          BOT_B64: ${{ needs.bot.outputs.bot }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          printf '%s' "$BOT_B64" | base64 -d | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8"));
            for (const e of d.newEvents || []) console.log(String(e.text).replace(/\s+/g, " "));
          ' > events.txt
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            gh issue create --repo "$REPO" --title "Bot: ${line:0:150}" \
              --body "$line

          Bot-Stand: https://shg9d54y9j-langw.github.io/Anna-test/#daily"
          done < events.txt

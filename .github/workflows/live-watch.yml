name: Live-Wächter

# GitHub startet geplante Läufe oft nur etwa einmal pro Stunde statt viertelstündlich.
# Deshalb macht jeder Lauf vier Runden im Abstand von etwa 15 Minuten. In jeder Runde gleicht auch der Copy-Bot ab, und
# Kursalarme und Stops aus der Push-Liste werden geprüft (Meldung aufs Handy, falls ntfy eingerichtet ist).
on:
  schedule:
    - cron: "4,19,34,49 6-21 * * 1-5"   # Mo–Fr, etwa 7–23 Uhr deutscher Zeit
  workflow_dispatch:

permissions: {}

# Ein Lauf nach dem anderen; ein neuer Lauf wartet, statt den laufenden abzubrechen
concurrency:
  group: live-watch
  cancel-in-progress: false

jobs:
  round1:
    uses: ./.github/workflows/live-round.yml
    permissions:
      contents: write
      issues: write
    with:
      delay: 0
    secrets:
      ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
      ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
      ETORO_BOT_API_KEY: ${{ secrets.ETORO_BOT_API_KEY }}
      ETORO_BOT_USER_KEY: ${{ secrets.ETORO_BOT_USER_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      PUSH_WATCH: ${{ secrets.PUSH_WATCH }}

  round2:
    needs: round1
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/live-round.yml
    permissions:
      contents: write
      issues: write
    with:
      delay: 840
    secrets:
      ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
      ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
      ETORO_BOT_API_KEY: ${{ secrets.ETORO_BOT_API_KEY }}
      ETORO_BOT_USER_KEY: ${{ secrets.ETORO_BOT_USER_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      PUSH_WATCH: ${{ secrets.PUSH_WATCH }}

  round3:
    needs: round2
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/live-round.yml
    permissions:
      contents: write
      issues: write
    with:
      delay: 840
    secrets:
      ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
      ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
      ETORO_BOT_API_KEY: ${{ secrets.ETORO_BOT_API_KEY }}
      ETORO_BOT_USER_KEY: ${{ secrets.ETORO_BOT_USER_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      PUSH_WATCH: ${{ secrets.PUSH_WATCH }}

  round4:
    needs: round3
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/live-round.yml
    permissions:
      contents: write
      issues: write
    with:
      delay: 840
    secrets:
      ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
      ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
      ETORO_BOT_API_KEY: ${{ secrets.ETORO_BOT_API_KEY }}
      ETORO_BOT_USER_KEY: ${{ secrets.ETORO_BOT_USER_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      PUSH_WATCH: ${{ secrets.PUSH_WATCH }}

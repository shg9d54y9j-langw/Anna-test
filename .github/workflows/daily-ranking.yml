name: Tagesempfehlung

on:
  schedule:
    # GitHub startet geplante Läufe oft bis zu einer Stunde später – deshalb zwei Versuche vor der Handy-Nachricht um 8:12 Uhr
    - cron: "41 4 * * 1-5"    # Mo–Fr früh (05:41 Uhr Winterzeit / 06:41 Uhr Sommerzeit)
    - cron: "17 5 * * 1-5"    # Mo–Fr vor Xetra-Eröffnung (06:17 Uhr Winterzeit / 07:17 Uhr Sommerzeit)
    - cron: "47 12 * * 1-5"   # Mo–Fr vor US-Eröffnung (13:47 Uhr Winterzeit / 14:47 Uhr Sommerzeit)
  workflow_dispatch:

# Grundsätzlich keine Rechte – jeder Job bekommt nur, was er braucht.
permissions: {}

concurrency:
  group: daily-ranking
  cancel-in-progress: false

jobs:
  # Job 1 kennt die eToro-Schlüssel, darf aber nichts im Repository ändern.
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      ranking: ${{ steps.calc.outputs.ranking }}
      returns: ${{ steps.calc.outputs.returns }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: eToro-Daten holen und Top 25 berechnen
        id: calc
        env:
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
        run: |
          node --version
          rm -f data/returns.json
          node scripts/daily-ranking.mjs
          if [ -f data/returns.json ]; then
            # gepackt: ungepackt lag die Rangliste mit 126 KB knapp unter der Grenze von 128 KB je Umgebungsvariable
            echo "ranking=$(gzip -9c data/ranking.json | base64 -w0)" >> "$GITHUB_OUTPUT"
            echo "returns=$(gzip -9c data/returns.json | base64 -w0)" >> "$GITHUB_OUTPUT"
          fi

  # Job 2 rechnet jede veröffentlichte Zahl unabhängig in Python nach – ohne Schlüssel, ohne Schreibrechte.
  verify:
    needs: fetch
    if: needs.fetch.outputs.ranking != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Unabhängige Gegenrechnung
        env:
          RANKING_B64: ${{ needs.fetch.outputs.ranking }}
          RETURNS_B64: ${{ needs.fetch.outputs.returns }}
        run: |
          printf '%s' "$RANKING_B64" | base64 -d | gunzip > /tmp/ranking.json
          printf '%s' "$RETURNS_B64" | base64 -d | gunzip > /tmp/returns.json
          python3 tests/verify_ranking.py /tmp/ranking.json /tmp/returns.json

  # Job 3 speichert erst, wenn die Gegenrechnung bestanden ist – bekommt keine eToro-Schlüssel.
  save:
    needs: [fetch, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}

      - name: Ergebnis speichern
        env:
          RANKING_B64: ${{ needs.fetch.outputs.ranking }}
          RETURNS_B64: ${{ needs.fetch.outputs.returns }}
        run: |
          mkdir -p data
          printf '%s' "$RANKING_B64" | base64 -d | gunzip > data/ranking.json
          printf '%s' "$RETURNS_B64" | base64 -d | gunzip > data/returns.json
          node -e 'for (const f of ["data/ranking.json", "data/returns.json"]) JSON.parse(require("fs").readFileSync(f, "utf8"))'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ranking.json data/returns.json
          git diff --cached --quiet || git commit -m "Tagesempfehlung $(date -u +%F)"
          # vorübergehende Ablehnung durch GitHub oder neuerer Stand auf dem Branch: neu aufsetzen und erneut versuchen
          for i in 1 2 3 4 5; do
            git push && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 4))
            git pull -q --rebase
          done

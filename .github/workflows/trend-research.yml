name: Trend-Forschung

# Nur von Hand: vergleicht vorab festgelegte Verbesserungen des Trend-Bots auf echten eToro-Kursen
# (2011 bis heute, getrennt nach zwei Hälften). Handelt nicht, ändert nichts; Ergebnis steht im Protokoll (nur Prozentwerte).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Varianten auf echten Kursen vergleichen
        env:
          # Nur der Lese-Schlüssel – keine Handelsrechte
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
        run: node scripts/trend-research.mjs

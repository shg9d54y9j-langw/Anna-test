name: Aktien-Daten

# Kennzahlen der beliebtesten Aktien und ETFs bei eToro für den Aktien-Check der Website.
on:
  schedule:
    - cron: "20 8 * * 1-5"    # Mo–Fr nach Börsenbeginn in Europa (09:20 Uhr Winterzeit / 10:20 Uhr Sommerzeit) –
                              # vorher fehlen in eToros Listen viele europäische ETFs
    - cron: "35 13 * * 1-5"   # Mo–Fr vor US-Eröffnung (14:35 / 15:35 Uhr)
  workflow_dispatch:

permissions: {}

concurrency:
  group: stock-data
  cancel-in-progress: false

jobs:
  # Kennt die eToro-Schlüssel (nur lesen), darf im Repository nichts ändern.
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.calc.outputs.ready }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Für die Handy-Meldungen: bisherigen Stand merken (die Läufe kommen nacheinander, siehe concurrency)
      - name: Bisherigen Stand merken
        run: |
          mkdir -p data
          if git fetch -q --depth=1 origin stock-data && git show FETCH_HEAD:stocks.json > data/prev-stocks.json; then
            echo "Bisheriger Stand gemerkt."
          else
            rm -f data/prev-stocks.json
            echo "Noch kein bisheriger Stand."
          fi

      - name: Kennzahlen der beliebtesten Aktien und ETFs berechnen
        id: calc
        env:
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ETORO_THROTTLE_MS: "560"     # Marktdaten: 120 Abfragen pro Minute
          CLOSES_OUT: ${{ runner.temp }}/closes.json   # Schlusskurse für die Note-Bilanz – bleiben auf diesem Rechner
        run: |
          node scripts/stock-universe.mjs
          if [ -f data/stocks.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Note-Bilanz: Gesamtnote des Tages merken und messen, wie die Aktien je Notenstufe danach liefen. Ohne Schlüssel;
      # schlägt sie fehl, bleibt beim Veröffentlichen der bisherige Stand.
      - name: Note-Bilanz rechnen
        if: steps.calc.outputs.ready == 'true'
        env:
          CLOSES_IN: ${{ runner.temp }}/closes.json
        run: |
          node scripts/note-track.mjs
          rm -f "$CLOSES_IN"

      # Als Artefakt weitergeben: als Umgebungsvariable wären die Daten zu groß (Linux erlaubt höchstens 128 KB je Wert)
      - name: Kennzahlen an den Veröffentlichungs-Schritt übergeben
        if: steps.calc.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stocks
          path: |
            data/stocks.json
            data/prev-stocks.json
            data/note-history.json
            data/note-track.json
            data/note-recent.json
          retention-days: 1
          if-no-files-found: error

  # Veröffentlicht die Kennzahlen und den Swing-Plan auf dem Zweig stock-data – ohne eToro-Schlüssel.
  # Der Swing-Planer (scripts/swing-planner.mjs) rechnet dabei aus den frischen Kennzahlen, den Firmen-Steckbriefen
  # und dem bisherigen Plan (Papier-Bilanz) den neuen Plan.
  save:
    needs: fetch
    if: needs.fetch.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stocks
          path: incoming

      - name: Aktien-Daten und Swing-Plan veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          STOCKS_FILE="$PWD/incoming/stocks.json" NOTES_DIR="$PWD/incoming" REMOTE="https://github.com/${REPO}.git" \
            PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" REPO_DIR="$PWD" bash scripts/publish-stock-data.sh

  # Meldungen aufs Handy über ntfy – nur wenn die Secrets NTFY_TOPIC und PUSH_WATCH eingerichtet sind (siehe Portfolio →
  # Benachrichtigungen). Kennt nur diese beiden Secrets, darf im Repository nichts ändern; Fehler stoppen den Lauf nicht.
  notify:
    needs: [fetch, save]
    if: needs.fetch.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stocks
          path: incoming

      - name: Meldungen aufs Handy (ntfy), falls eingerichtet
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUSH_WATCH: ${{ secrets.PUSH_WATCH }}
          NOTIFY_MODE: events
          STOCKS_PREV: incoming/prev-stocks.json
          STOCKS_NEW: incoming/stocks.json
          NOTE_RECENT: incoming/note-recent.json
        run: node scripts/notify.mjs

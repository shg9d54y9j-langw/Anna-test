name: Rechenkontrolle

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Sicherheits-Check – Abläufe, Schutzregel der Seite, Zieladressen der Skripte, Echtgeld-Sperre, keine Schlüssel im Repository
        run: node tests/security.mjs --list

      - name: Job gegen Test-Server, unabhängige Gegenrechnung, Live-Wächter
        env:
          ETORO_API_BASE: http://localhost:8790/api
          ETORO_THROTTLE_MS: "0"
          ETORO_API_KEY: test-public-key-0000
          ETORO_USER_KEY: test-user-key-0000
          RANKING_OUT: /tmp/ranking.json
          RETURNS_OUT: /tmp/returns.json
          RANKING_IN: /tmp/ranking.json
          LIVE_OUT: /tmp/live.json
        run: |
          node tests/mock-etoro.mjs 8790 & sleep 1
          node scripts/daily-ranking.mjs
          python3 tests/verify_ranking.py /tmp/ranking.json /tmp/returns.json
          node scripts/live-watch.mjs
          node -e 'const d = JSON.parse(require("fs").readFileSync("/tmp/live.json", "utf8")); if (!d.entries.length) throw new Error("Live-Stand leer");'

      - name: Marktlage-Cockpit gegen den Test-Server, unabhängige Gegenrechnung
        env:
          ETORO_API_BASE: http://localhost:8791/api
          ETORO_THROTTLE_MS: "0"
          ETORO_API_KEY: test-public-key-0000
          ETORO_USER_KEY: test-user-key-0000
          FRED_BASE: http://localhost:8791/fred
          MARKET_OUT: /tmp/market.json
        run: |
          node tests/mock-etoro.mjs 8791 & sleep 1
          node scripts/market-cockpit.mjs
          python3 tests/verify_market.py /tmp/market.json http://localhost:8791

      - name: Firmen-Steckbriefe der Theorie-Seite prüfen
        run: node tests/check-firms.mjs

      - name: Bereich Vermögen – Forschungsstand, Quellen, ISIN, Steuerpunkte (data/wealth.json)
        run: node tests/check-wealth.mjs

      - name: Europäische Aktien – Namen vergleichen, Europa-Liste auflösen, Zusatznamen, Aufbau von data/europe.json
        run: node tests/europe.mjs

      - name: Aktien-Daten gegen den Test-Server, unabhängige Gegenrechnung
        env:
          ETORO_API_BASE: http://localhost:8792/api
          ETORO_THROTTLE_MS: "0"
          ETORO_API_KEY: test-public-key-0000
          ETORO_USER_KEY: test-user-key-0000
          FINNHUB_BASE: http://localhost:8792/finnhub
          FINNHUB_API_KEY: test-finnhub-0000
          FINNHUB_THROTTLE_MS: "0"
          STOCK_COUNT: "60"
          ETF_COUNT: "10"
          SEARCH_PAGE_SIZE: "50"
          STOCKS_OUT: /tmp/stocks.json
          CLOSES_OUT: /tmp/closes.json      # Schlusskurse für die Note-Bilanz (nur lokal)
          FIRMS_IN: tests/firms-test.json   # Firmen der Theorie-Seite: STK065 muss trotz geringer Beliebtheit dabei sein
          EUROPE_IN: tests/europe-test.json # Europa-Liste: über Kürzel und Namen, Wien vor Xetra, fremde Namen bleiben draußen
          EUROPE_COUNT: "3"                 # dazu die drei beliebtesten weiteren europäischen Aktien
        run: |
          node tests/mock-etoro.mjs 8792 & sleep 1
          node scripts/stock-universe.mjs
          python3 tests/verify_stocks.py /tmp/stocks.json http://localhost:8792
          node tests/check-popularity.mjs

      - name: Swing-Planer – Zustände, Stop und Bilanz (Szenarien), unabhängige Gegenrechnung, Veröffentlichen mit Bilanz
        env:
          STOCKS_IN: /tmp/stocks.json      # aus dem Schritt davor
          FIRMS_IN: tests/swing-firms-test.json
          SWING_OUT: /tmp/swing.json
        run: |
          node tests/swing-scenarios.mjs
          node scripts/swing-planner.mjs
          python3 tests/verify_swing.py /tmp/stocks.json /tmp/swing.json tests/swing-firms-test.json
          bash tests/check-publish.sh /tmp/stocks.json

      - name: Kennzahlen und Insider-Geschäfte gegen den Test-Server, unabhängige Gegenrechnung (auch gesperrter Tarif)
        env:
          FINNHUB_BASE: http://localhost:8794/finnhub
          FINNHUB_API_KEY: test-finnhub-0000
          FINNHUB_THROTTLE_MS: "0"
          STOCKS_IN: /tmp/stocks.json      # aus dem Aktien-Daten-Schritt
        run: |
          node tests/mock-etoro.mjs 8794 & sleep 1
          FUND_OUT=/tmp/fund.json node scripts/fund-data.mjs
          python3 tests/verify_fund.py /tmp/stocks.json /tmp/fund.json http://localhost:8794
          curl -sf -X POST http://localhost:8794/__test/finnhub-flags -H 'content-type: application/json' -d '{"insiderForbidden":true}' > /dev/null
          FUND_PREV=/tmp/fund.json FUND_OUT=/tmp/fund2.json node scripts/fund-data.mjs
          python3 tests/verify_fund.py /tmp/stocks.json /tmp/fund2.json http://localhost:8794 --forbidden /tmp/fund.json

      - name: Note-Bilanz – Noten wie auf der Website, Auswertung ohne Blick in die Zukunft, Lauf mit den Testdaten
        env:
          STOCKS_IN: /tmp/stocks.json      # aus dem Aktien-Daten-Schritt
          CLOSES_IN: /tmp/closes.json
          FUND_IN: /tmp/fund.json          # aus dem Kennzahlen-Schritt
          HISTORY_IN: /tmp/note-history-fehlt.json
          HISTORY_OUT: /tmp/note-history.json
          TRACK_OUT: /tmp/note-track.json
          RECENT_OUT: /tmp/note-recent.json
          NOTE_MIN_STOCKS: "20"
        run: |
          node tests/note-track.mjs
          node scripts/note-track.mjs
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs"), rd = f => JSON.parse(fs.readFileSync(f, "utf8"));
            const s = rd("/tmp/stocks.json"), c = rd("/tmp/closes.json"), h = rd("/tmp/note-history.json"), t = rd("/tmp/note-track.json"), r = rd("/tmp/note-recent.json");
            const aktien = s.items.filter(x => x.type === "Aktie").map(x => x.sym).sort();
            if (Object.keys(c.items).sort().join() !== aktien.join()) throw new Error("Schlusskurse nicht genau für die Aktien");
            const n = h.snaps.length === 1 ? Object.keys(h.snaps[0].n).length : 0;
            if (n < 20 || Object.keys(h.snaps[0].n).some(k => !aktien.includes(k))) throw new Error(`Momentaufnahme falsch (${n} Noten)`);
            if (t.days !== 1 || t.stocks !== n || t.horizons.some(x => x.days !== 0 || !x.firstAt)) throw new Error("Bilanz des ersten Tages falsch");
            // nur Noten und Durchschnitte: Momentaufnahmen nur mit Datum, ganzzahligen Noten und den sechs ganzzahligen Teilnoten,
            // Bilanz nur mit bekannten Feldern, „Note lernt dazu“ nur mit Kennzahlen je Teilnote
            const note = v => Number.isInteger(v) && v >= 0 && v <= 100;
            if (h.snaps.some(x => Object.keys(x).join() !== "d,n,p" || Object.values(x.n).some(v => !note(v)) || Object.keys(x.p).some(k => !(k in x.n)) || Object.values(x.p).some(a => !Array.isArray(a) || a.length !== 6 || a.some(v => v !== null && !note(v))))) throw new Error("Momentaufnahme mit fremden Feldern");
            if (!Array.isArray(h.ic) || h.ic.length !== 0 || Object.keys(h).sort().join() !== "ic,snaps,updated,v") throw new Error("Treffsicherheit am ersten Tag falsch");
            if (Object.keys(t).sort().join() !== "curve,days,groups,horizons,last,learn,since,stocks,updated" || Object.keys(t.curve).sort().join() !== "all,dates,low,top") throw new Error("Bilanz mit fremden Feldern");
            const L = t.learn;
            if (Object.keys(L).sort().join() !== "active,days,factors,firstAt,fullDays,lambda,minDays,since,until,weights" || L.days !== 0 || L.active || L.weights !== null || !/^\d{4}-\d\d-\d\d$/.test(L.firstAt) || L.factors.length !== 6 || L.factors.some(f => Object.keys(f).sort().join() !== "ic,k,label,n,t,w,w0" || f.n !== 0 || f.w !== f.w0)) throw new Error("Note lernt dazu: falsche Felder am ersten Tag");
            if (Object.keys(r.n).length !== n || "w" in r || Object.values(r.n).some(v => v.length !== 5 || v.slice(1).some(x => x !== null))) throw new Error("Notenverlauf des ersten Tages falsch");
            console.log(`Note-Bilanz mit Testdaten: ${n} Noten, erste Wochen-Bilanz ab ${t.horizons[0].firstAt}, erste Messung der Treffsicherheit ab ${L.firstAt}.`);
          '

      - name: Nachrichten gegen den Test-Server, Einordnung nach Typ, unabhängige Gegenrechnung
        env:
          FINNHUB_BASE: http://localhost:8795/finnhub
          FINNHUB_API_KEY: test-finnhub-0000
          FINNHUB_THROTTLE_MS: "0"
          STOCKS_IN: /tmp/stocks.json      # aus dem Aktien-Daten-Schritt
          NEWS_OUT: /tmp/news
        run: |
          node tests/news-classify.mjs
          node tests/mock-etoro.mjs 8795 & sleep 1
          node scripts/news-data.mjs
          python3 tests/verify_news.py /tmp/stocks.json /tmp/news http://localhost:8795

      - name: Wechselkurse (EZB) – Auswahl, Lücken, Wochenenden, Prüfungen
        run: node tests/fx-data.mjs

      - name: Zinsen und Inflation (EZB) – CSV, Alter, Pflicht-Reihen, Plausibilität
        run: node tests/wealth-data.mjs

      - name: Kursalarme alle 15 Minuten – Verschlüsselung, Ereignisse, Läufe gegen den Test-Server, nichts Geheimes im Protokoll
        run: node tests/price-alarms.mjs

      - name: Daten-Status – Werktags- und Live-Stunden, Ausfälle, neue und behobene Probleme, Handy-Meldung
        run: node tests/data-status.mjs

      - name: Handy-Meldungen (ntfy) mit nachgebautem Server, auch mit den Aktien-Daten und Nachrichten der Testläufe
        env:
          NOTIFY_REAL_STOCKS: /tmp/stocks.json   # aus dem Aktien-Daten-Schritt
          NOTIFY_REAL_NEWS: /tmp/news            # aus dem Nachrichten-Schritt
        run: node tests/notify.mjs

      - name: Copy-Bot gegen den Test-Server (Start, Wechsel, Stop Loss, eigene Kopien, Echtgeld-Obergrenze)
        run: node tests/bot-scenarios.mjs

      - name: Trend-Bot – Signale gegen den Test-Server, unabhängige Gegenrechnung
        env:
          ETORO_API_BASE: http://localhost:8793/api
          FRED_BASE: http://localhost:8793/fred
          ETORO_THROTTLE_MS: "0"
          ETORO_API_KEY: test-public-key-0000
          ETORO_USER_KEY: test-user-key-0000
          TREND_SIGNALS_OUT: /tmp/trend-signals.json
        run: |
          node tests/mock-etoro.mjs 8793 & sleep 1
          node scripts/trend-bot.mjs signals
          python3 tests/verify_trend.py /tmp/trend-signals.json http://localhost:8793

      - name: Trend-Bot – Handel im Demokonto (Start, Ausstieg, offene und unklare Aufträge, Stopp, nie Echtgeld)
        run: node tests/trend-bot-scenarios.mjs

      - name: Schlüssel gehen nur an eToro
        run: |
          if ETORO_API_BASE=https://example.com/api ETORO_API_KEY=x-123456789 ETORO_USER_KEY=y-123456789 node scripts/daily-ranking.mjs; then
            echo "::error::Fremde API-Adresse wurde nicht abgewiesen"; exit 1
          fi
          echo "Fremde Adresse korrekt abgewiesen."

  # Die Seite selbst im Browser (Chromium, Handy und Computer) mit festen Testdaten – ohne Schlüssel, ohne echte Konten.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Playwright und Chromium installieren
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Browser-Tests – Suche, Note, Vergleich, Alarme, News, Portfolio, Sicherung, Bilanz, Seite anpassen, ohne Netz
        run: bash tests/browser/run.sh

name: Zinsen und Inflation

# Für den Bereich „Vermögen“: EZB-Einlagezins, €STR, Inflation (Euroraum, Österreich) und Renditen von Staatsanleihen
# bester Bonität aus dem EZB Data Portal – an jedem Werktag nach den Veröffentlichungen der EZB. Kein Schlüssel nötig;
# veröffentlicht wird nur eine kleine aufbereitete Datei auf dem Zweig wealth-data.
on:
  schedule:
    - cron: "13 16 * * 1-5"   # Mo–Fr 16:13 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: wealth-data
  cancel-in-progress: false

jobs:
  # Holt die Reihen von der EZB und prüft sie – darf im Repository nichts ändern.
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Zinsen und Inflation von der EZB holen
        run: MACRO_OUT="$RUNNER_TEMP/macro.json" node scripts/wealth-data.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macro
          path: ${{ runner.temp }}/macro.json
          retention-days: 1
          if-no-files-found: error

  # Veröffentlicht die Datei auf dem Zweig wealth-data.
  save:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macro
          path: incoming

      - name: Zinsen und Inflation veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir out && cd out
          cp ../incoming/macro.json .
          # shellcheck disable=SC2016
          node -e '
            const d = JSON.parse(require("fs").readFileSync("macro.json", "utf8")), s = d.series || {};
            if (!s.deposit || !s.hicpEA || !s.y5) { console.log("::error::Zinsen und Inflation unvollständig – nichts veröffentlicht"); process.exit(1); }
            console.log(Object.keys(s).join(", "));
          '
          git init -q -b wealth-data
          git add macro.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Zinsen und Inflation $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:wealth-data && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 4))
          done
